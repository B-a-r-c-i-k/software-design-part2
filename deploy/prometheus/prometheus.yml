global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - client:8081
          - service1:8080
          - service2:8080

  - job_name: zookeeper-jmx
    scrape_interval: 15s
    static_configs:
      - targets:
          - zookeeper:9414
